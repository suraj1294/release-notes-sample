name: Create Release in ReleaseNotes.io

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Release title"
        required: true
        type: string
      body:
        description: "Release notes/body"
        required: false
        type: string
        default: ""
      external_id:
        description: "External ID"
        required: false
        type: string
        default: ""

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Create Release in ReleaseNotes.io
        id: create_release
        run: |
          # Create release and capture output
          OUTPUT=$(node .github/scripts/create-release.cjs)

          # Extract the JSON between the markers
          RELEASE_JSON=$(echo "$OUTPUT" | sed -n '/--- RELEASE_INFO_START ---/,/--- RELEASE_INFO_END ---/p' | head -n -1 | tail -n +2)

          # Output the release info
          echo "release_info=$RELEASE_JSON" >> $GITHUB_OUTPUT

          # Also set individual outputs for easier access
          RELEASE_ID=$(echo "$RELEASE_JSON" | jq -r '.release_id')
          EXTERNAL_ID=$(echo "$RELEASE_JSON" | jq -r '.external_id')
          echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT
          echo "external_id=$EXTERNAL_ID" >> $GITHUB_OUTPUT

          # Print the release info for debugging
          echo "Created release with ID: $RELEASE_ID and external ID: $EXTERNAL_ID"
        env:
          RELEASENOTES_API_KEY: ${{ secrets.RELEASENOTES_API_KEY }}
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          RELEASE_TITLE: ${{ github.event.inputs.title }}
          RELEASE_BODY: ${{ github.event.inputs.body || '' }}
          EXTERNAL_ID: release-${{ github.event.inputs.external_id }}

      - name: Update release config
        id: update_config
        run: |
          # Create public directory if it doesn't exist
          mkdir -p public

          # Get release info from previous step outputs
          RELEASE_ID="${{ steps.create_release.outputs.release_id }}"
          EXTERNAL_ID="${{ steps.create_release.outputs.external_id }}"

          # Create or update releasenote-config.json
          CONFIG_FILE="public/releasenote-config.json"
          if [ -f "$CONFIG_FILE" ]; then
            # Update existing config
            jq --arg id "$RELEASE_ID" --arg ext_id "$EXTERNAL_ID" '
              .release_id = $id |
              .external_id = $ext_id
            ' "$CONFIG_FILE" > "${CONFIG_FILE}.tmp" && mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE"
          else
            # Create new config
            echo "{\"release_id\": \"$RELEASE_ID\", \"external_id\": \"$EXTERNAL_ID\"}" > "$CONFIG_FILE"
          fi

          # Output the branch name for the next step
          echo "branch_name=update/release-config-${RELEASE_ID}" >> $GITHUB_OUTPUT

          # Print the updated config for debugging
          echo "Updated config file:"
          cat "$CONFIG_FILE"
        shell: bash

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ${{ steps.update_config.outputs.branch_name }}
          title: "Update release configuration for ${{ steps.create_release.outputs.external_id }}"
          body: |
            Automated update of release configuration with new release:
            - Release ID: ${{ steps.create_release.outputs.release_id }}
            - External ID: ${{ steps.create_release.outputs.external_id }}
          commit-message: "Update release config with ID: ${{ steps.create_release.outputs.release_id }}"
          signoff: false
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
