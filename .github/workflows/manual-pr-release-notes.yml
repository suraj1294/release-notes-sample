name: Manual PR Release Notes

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to generate release notes for"
        required: true
        type: number

jobs:
  generate-pr-release-notes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Install GitHub CLI
        run: sudo apt-get update && sudo apt-get install gh -y

      - name: Prepare PR data
        id: prepare_data
        run: |
          # Default values
          TITLE="${{ github.event.inputs.pr_title || github.event.pull_request.title || 'Untitled PR' }}"
          BODY="${{ github.event.inputs.pr_body || github.event.pull_request.body || 'No description provided' }}"
          PR_NUMBER="${{ github.event.inputs.pr_number || github.event.pull_request.number }}"
          COMMIT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"

          # Configure Git to use the GitHub token
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # Check for #releasenotes tag (case insensitive)
          if echo "$TITLE" | grep -qi '#releasenotes'; then
            echo "::notice::#releasenotes tag found in PR title, proceeding with release notes"
            echo "has_tag=true" | tee -a $GITHUB_OUTPUT
            # Remove the #releasenotes tag from the title
            CLEAN_TITLE=$(echo "$TITLE" | sed 's/#releasenotes\s*//i')
            TITLE="$CLEAN_TITLE"
          else
            echo "::notice::No #releasenotes tag found in PR title, skipping release notes"
            echo "has_tag=false" | tee -a $GITHUB_OUTPUT
          fi
          
          # Output the values
          echo "title=${TITLE//$'\n'/ }" | tee -a $GITHUB_OUTPUT
          echo "body=$(echo "$BODY" | jq -Rs . | sed 's/^\"\(.*\)\"$/\1/')" | tee -a $GITHUB_OUTPUT
          echo "pr_number=${PR_NUMBER}" | tee -a $GITHUB_OUTPUT
          echo "commit_sha=${COMMIT_SHA}" | tee -a $GITHUB_OUTPUT
          
          # Debug output
          echo "PR Title: $TITLE"
          echo "PR Number: $PR_NUMBER"

      - name: Check for required secrets
        id: check_secrets
        run: |
          if [ -z "$RELEASENOTES_API_KEY" ]; then
            echo "::error::RELEASENOTES_API_KEY secret is not set"
            exit 1
          fi
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY secret is not set"
            exit 1
          fi
          if [ -z "$RELEASE_ID" ] || [ -z "$EXTERNAL_ID" ] || [ -z "$PROJECT_ID" ]; then
            echo "::error::One or more required variables are not set. Please set RELEASE_ID, EXTERNAL_ID, and PROJECT_ID in your repository's secrets or variables"
            exit 1
          fi
        env:
          RELEASENOTES_API_KEY: ${{ secrets.RELEASENOTES_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RELEASE_ID: ${{ secrets.RELEASE_ID || vars.RELEASE_ID || '' }}
          EXTERNAL_ID: ${{ secrets.EXTERNAL_ID || vars.EXTERNAL_ID || '' }}
          PROJECT_ID: ${{ secrets.PROJECT_ID || vars.PROJECT_ID || '9630' }}

      - name: Push to ReleaseNotes.io (via JS)
        if: steps.prepare_data.outputs.has_tag == 'true'
        run: |
          # Debug: Print environment variables (without sensitive values)
          echo "Using RELEASE_ID: $RELEASE_ID"
          echo "Using PROJECT_ID: $PROJECT_ID"
          echo "PR Title: $PR_TITLE"
          echo "PR Number: $PR_NUMBER"

          # Run the script
          node .github/scripts/update-draft-release.cjs
        env:
          # Required for ReleaseNotes.io
          RELEASENOTES_API_KEY: ${{ secrets.RELEASENOTES_API_KEY }}
          RELEASE_ID: ${{ secrets.RELEASE_ID || vars.RELEASE_ID || '' }}
          EXTERNAL_ID: ${{ secrets.EXTERNAL_ID || vars.EXTERNAL_ID || '' }}
          PROJECT_ID: ${{ secrets.PROJECT_ID || vars.PROJECT_ID || '' }}

          # Required for AI summary generation
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          # PR data
          PR_TITLE: ${{ steps.pr_data.outputs.title }}
          PR_BODY: ${{ steps.pr_data.outputs.body }}
          PR_NUMBER: ${{ steps.pr_data.outputs.pr_number }}
