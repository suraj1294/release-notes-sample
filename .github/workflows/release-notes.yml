# .github/workflows/release-notes.yml
name: Push PR Summary to ReleaseNotes.io

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  push-to-releasenotes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Get PR details
        id: pr
        uses: octokit/request-action@v2.x
        with:
          route: GET /repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate AI summary
        id: ai_summary
        run: |
          echo "${{ steps.pr.outputs.data }}" > pr_data.json
          TITLE=$(jq -r '.title' pr_data.json)
          BODY=$(jq -r '.body' pr_data.json)
          DIFF_URL=$(jq -r '.diff_url' pr_data.json)

          # Example: using OpenAI API (you must set OPENAI_API_KEY in secrets)
          SUMMARY=$(curl https://api.openai.com/v1/chat/completions \
            -s \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "gpt-4",
              "messages": [
                {"role": "system", "content": "Summarize this pull request for release notes."},
                {"role": "user", "content": "'"${TITLE}\n\n${BODY}"'"}
              ]
            }' | jq -r '.choices[0].message.content')

          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT

        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Push to ReleaseNotes.io
        run: |
          curl -X POST https://api.releasenotes.io/v1/releases/draft/entries \
            -H "Authorization: Bearer ${{ secrets.RELEASENOTES_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "title": "'"${{ steps.pr.outputs.title }}"'",
              "body": "'"${{ steps.ai_summary.outputs.summary }}"'"
            }'
