# .github/workflows/release-notes.yml
name: Push PR Summary to ReleaseNotes.io

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  push-to-releasenotes:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          if ! command -v gh &> /dev/null; then
            echo "GitHub CLI not found, installing..."
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg \
            && sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg \
            && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
            && sudo apt-get update \
            && sudo apt-get install gh -y
          fi

      - name: Set up GitHub token
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure git
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global --add safe.directory /github/workspace
          
          # Authenticate GitHub CLI
          echo "$GITHUB_TOKEN" | gh auth login --with-token
          gh auth status

      - name: Fetch PR data
        id: pr_data
        run: |
          # Default values
          TITLE="${{ github.event.head_commit.message || 'Untitled PR' }}"
          BODY="${{ github.event.head_commit.message || 'No description provided' }}"
          PR_NUMBER=""
          
          # If triggered by pull_request event
          if [[ -n "${{ github.event.pull_request.number }}" ]]; then
            echo "Fetching data from PR #${{ github.event.pull_request.number }}"
            gh pr view "${{ github.event.pull_request.number }}" --json title,body,number > pr.json || {
              echo "Failed to fetch PR data, using commit message as fallback"
              echo "title=$TITLE" | tee -a $GITHUB_OUTPUT
              echo "body=$BODY" | tee -a $GITHUB_OUTPUT
              echo "pr_number=" | tee -a $GITHUB_OUTPUT
              exit 0
            }
            
            TITLE=$(jq -r '.title // ""' pr.json)
            BODY=$(jq -r '.body // ""' pr.json)
            PR_NUMBER=$(jq -r '.number // ""' pr.json)
            
            # Fallback if title is empty
            if [[ -z "$TITLE" ]]; then
              TITLE="${{ github.event.head_commit.message || 'Untitled PR' }}"
            fi
            
            # Fallback if body is empty
            if [[ -z "$BODY" ]]; then
              BODY="${{ github.event.head_commit.message || 'No description provided' }}"
            fi
          fi
          
          # Output the values
          echo "title=${TITLE//$'\n'/ }" | tee -a $GITHUB_OUTPUT
          echo "body=$(echo "$BODY" | jq -Rs . | sed 's/^"\(.*\)"$/\1/')" | tee -a $GITHUB_OUTPUT
          echo "pr_number=${PR_NUMBER}" | tee -a $GITHUB_OUTPUT
          
          # Debug output
          echo "Using title: ${TITLE:0:50}..."
          echo "Using PR number: $PR_NUMBER"

      # AI summary generation has been moved to the update-draft-release.cjs script

      - uses: actions/checkout@v4
      - name: Check for required secrets
        id: check_secrets
        run: |
          if [ -z "$RELEASENOTES_API_KEY" ]; then
            echo "::error::RELEASENOTES_API_KEY secret is not set"
            exit 1
          fi
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY secret is not set"
            exit 1
          fi
          if [ -z "$RELEASE_ID" ] || [ -z "$EXTERNAL_ID" ] || [ -z "$PROJECT_ID" ]; then
            echo "::error::One or more required variables are not set. Please set RELEASE_ID, EXTERNAL_ID, and PROJECT_ID in your repository's secrets or variables"
            exit 1
          fi
        env:
          RELEASENOTES_API_KEY: ${{ secrets.RELEASENOTES_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RELEASE_ID: ${{ secrets.RELEASE_ID || vars.RELEASE_ID || '' }}
          EXTERNAL_ID: ${{ secrets.EXTERNAL_ID || vars.EXTERNAL_ID || '' }}
          PROJECT_ID: ${{ secrets.PROJECT_ID || vars.PROJECT_ID || '9630' }}

      - name: Push to ReleaseNotes.io (via JS)
        run: |
          # Debug: Print environment variables (without sensitive values)
          echo "Using RELEASE_ID: $RELEASE_ID"
          echo "Using PROJECT_ID: $PROJECT_ID"
          
          # Run the script
          node .github/scripts/update-draft-release.cjs
        env:
          # Required for ReleaseNotes.io
          RELEASENOTES_API_KEY: ${{ secrets.RELEASENOTES_API_KEY }}
          RELEASE_ID: ${{ secrets.RELEASE_ID || vars.RELEASE_ID || '' }}
          EXTERNAL_ID: ${{ secrets.EXTERNAL_ID || vars.EXTERNAL_ID || '' }}
          PROJECT_ID: ${{ secrets.PROJECT_ID || vars.PROJECT_ID || '9630' }}
          
          # Required for AI summary generation
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          
          # PR data
          PR_TITLE: "${{ steps.pr_data.outputs.title }}"
          PR_BODY: "${{ steps.pr_data.outputs.body }}"

      # - name: Push to ReleaseNotes.io (stubbed API call)
