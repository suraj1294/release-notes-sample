# .github/workflows/release-notes.yml
name: Push PR Summary to ReleaseNotes.io

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  push-to-releasenotes:
    runs-on: ubuntu-latest

    steps:
      - name: Install GitHub CLI
        run: sudo apt-get update && sudo apt-get install gh -y

      - name: Fetch PR title and body using gh
        id: pr_data
        run: |
          gh auth setup-git
          gh pr view ${{ github.event.pull_request.number }} --json title,body --repo ${{ github.repository }} > pr.json
          TITLE=$(jq -r '.title' pr.json)
          BODY=$(jq -r '.body' pr.json)

          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "body=$BODY" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate mock AI summary
        id: summary
        run: |
          BODY="${{ steps.pr_data.outputs.body }}"
          SUMMARY=$(echo "$BODY" | head -c 200)
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          node-version: 20.x
      - name: Push to ReleaseNotes.io (via JS)

        run: |
          node .github/scripts/pushToReleaseNotes.cjs
        env:
          RELEASENOTES_API_KEY: ${{ secrets.RELEASENOTES_API_KEY }}
          PR_TITLE: "${{ steps.pr_data.outputs.title }}"
          PR_SUMMARY: "${{ steps.summary.outputs.summary }}"

      - name: Push to ReleaseNotes.io (stubbed API call)
        run: |
          TITLE="${{ steps.pr_data.outputs.title }}"
          SUMMARY="${{ steps.summary.outputs.summary }}"

          echo "Posting to ReleaseNotes.io"
          echo "Title: $TITLE"
          echo "Summary: $SUMMARY"

          curl -X POST https://api.releasenotes.io/v1/releases/draft/entries \
            -H "Authorization: Bearer ${{ secrets.RELEASENOTES_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "title": "'"${TITLE//\"/\\\"}"'",
              "body": "'"${SUMMARY//\"/\\\"}"'"
            }'
        env:
          RELEASENOTES_API_KEY: ${{ secrets.RELEASENOTES_API_KEY }}
