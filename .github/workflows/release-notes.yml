# .github/workflows/release-notes.yml
name: Push PR Summary to ReleaseNotes.io

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  push-to-releasenotes:
    runs-on: ubuntu-latest

    steps:
      - name: Install GitHub CLI
        run: sudo apt-get update && sudo apt-get install gh -y

      - name: Fetch PR title and body using gh
        id: pr_data
        run: |
          gh auth setup-git
          gh pr view ${{ github.event.pull_request.number }} --json title,body --repo ${{ github.repository }} > pr.json
          TITLE=$(jq -r '.title' pr.json)
          BODY=$(jq -r '.body' pr.json)

          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "body=$BODY" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate AI summary
        id: ai_summary
        run: |
          # Set inputs
          TITLE="${{ steps.pr_data.outputs.title }}"
          BODY="${{ steps.pr_data.outputs.body }}"
          
          # Debug info
          echo "Generating summary for PR: $TITLE"
          
          # Call OpenAI API with improved error handling
          RESPONSE=$(curl https://api.openai.com/v1/chat/completions \
            -s \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "gpt-4",
              "messages": [
                {"role": "system", "content": "Summarize this pull request for release notes. Be concise and focus on user-facing changes. Include the type of change (e.g., 'Fix', 'Feature', 'Enhancement') at the beginning."},
                {"role": "user", "content": "'"${TITLE//\/\\/}"\n\n""${BODY//\/\\/}"'"}
              ],
              "temperature": 0.3,
              "max_tokens": 200
            }' 2>&1)
          
          # Check for curl errors
          if [ $? -ne 0 ]; then
              echo "::error::Failed to call OpenAI API"
              echo "API Response: $RESPONSE"
              exit 1
          fi
          
          # Extract and validate summary
          SUMMARY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content' 2>/dev/null)
          if [ -z "$SUMMARY" ] || [ "$SUMMARY" = "null" ]; then
              echo "::error::Failed to extract summary from API response"
              echo "API Response: $RESPONSE"
              exit 1
          fi
          
          # Debug output
          echo "Generated summary: $SUMMARY"
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT

        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Generate mock AI summary
        id: summary
        run: |
          BODY="${{ steps.ai_summary.outputs.summary }}"
          SUMMARY=$(echo "$BODY" | head -c 200)
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
      - name: Check for required secrets
        id: check_secrets
        run: |
          if [ -z "$RELEASENOTES_API_KEY" ]; then
            echo "::error::RELEASENOTES_API_KEY secret is not set"
            exit 1
          fi
          if [ -z "$RELEASE_ID" ] || [ -z "$EXTERNAL_ID" ] || [ -z "$PROJECT_ID" ]; then
            echo "::error::One or more required variables are not set. Please set RELEASE_ID, EXTERNAL_ID, and PROJECT_ID in your repository's secrets or variables"
            exit 1
          fi
        env:
          RELEASENOTES_API_KEY: ${{ secrets.RELEASENOTES_API_KEY }}
          RELEASE_ID: ${{ secrets.RELEASE_ID || vars.RELEASE_ID || '' }}
          EXTERNAL_ID: ${{ secrets.EXTERNAL_ID || vars.EXTERNAL_ID || '' }}
          PROJECT_ID: ${{ secrets.PROJECT_ID || vars.PROJECT_ID || '9630' }}

      - name: Push to ReleaseNotes.io (via JS)
        run: |
          node .github/scripts/update-draft-release.cjs
        env:
          RELEASENOTES_API_KEY: ${{ secrets.RELEASENOTES_API_KEY }}
          PR_TITLE: "${{ steps.pr_data.outputs.title }}"
          PR_SUMMARY: "${{ steps.summary.outputs.summary }}"
          RELEASE_ID: ${{ secrets.RELEASE_ID || vars.RELEASE_ID }}
          EXTERNAL_ID: ${{ secrets.EXTERNAL_ID || vars.EXTERNAL_ID }}
          PROJECT_ID: ${{ secrets.PROJECT_ID || vars.PROJECT_ID || '9630' }}

