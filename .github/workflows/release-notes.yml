# .github/workflows/release-notes.yml
name: Push Release Notes on Push

on:
  push:
    branches: [main]

jobs:
  push-to-releasenotes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Install GitHub CLI
        run: sudo apt-get update && sudo apt-get install gh -y
      - name: Check for #releasenotes tag
        id: check_tag
        run: |
          # Check if commit message contains #releasenotes (case insensitive)
          if echo "${{ github.event.head_commit.message || '' }}" | grep -qi '#releasenotes'; then
            echo "::notice::#releasenotes tag found, proceeding with release notes"
            echo "has_tag=true" >> $GITHUB_OUTPUT
          else
            echo "::notice::No #releasenotes tag found, skipping release notes"
            echo "has_tag=false" >> $GITHUB_OUTPUT
          fi

      - name: Prepare release notes data
        if: steps.check_tag.outputs.has_tag == 'true'
        id: prepare_data
        run: |
          # For push events, use the commit message (remove the #releasenotes tag)
          COMMIT_MSG="${{ github.event.head_commit.message || 'Untitled Commit' }}"
          TITLE="$(echo "$COMMIT_MSG" | sed 's/#releasenotes\s*//i' | head -1)"
          BODY="$(echo "$COMMIT_MSG" | sed 's/#releasenotes\s*//i')"
          COMMIT_SHA="${{ github.sha }}"

          # Debug output
          echo "Commit Message: $COMMIT_MSG"
          echo "Title: $TITLE"
          echo "Commit SHA: $COMMIT_SHA"

          # Configure Git to use the GitHub token
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # Check for #releasenotes tag (case insensitive)
          if echo "$COMMIT_MSG" | grep -qi '#releasenotes'; then
            echo "::notice::#releasenotes tag found, proceeding with release notes"
            echo "has_tag=true" | tee -a $GITHUB_OUTPUT
          else
            echo "::notice::No #releasenotes tag found, skipping release notes"
            echo "has_tag=false" | tee -a $GITHUB_OUTPUT
          fi

          # Output the values
          echo "title=${TITLE//$'\n'/ }" | tee -a $GITHUB_OUTPUT
          echo "body=$(echo "$BODY" | jq -Rs . | sed 's/^\"\(.*\)\"$/\1/')" | tee -a $GITHUB_OUTPUT
          echo "commit_sha=${COMMIT_SHA}" | tee -a $GITHUB_OUTPUT

      # AI summary generation has been moved to the update-draft-release.cjs script

      - uses: actions/checkout@v4
      - name: Fetch release config from site
        id: fetch_config
        run: |
          # Get the app URL from environment variables or use github-pages URL as fallback
          APP_URL="${{ vars.APP_URL }}"
          CONFIG_URL="${APP_URL}/releasenote-config.json"

          echo "Fetching release config from: $CONFIG_URL"

          # Fetch the config file
          CONFIG_JSON=$(curl -s "$CONFIG_URL" || echo '{}')

          # Parse the JSON and set outputs
          RELEASE_ID=$(echo "$CONFIG_JSON" | jq -r '.release_id // ""')
          EXTERNAL_ID=$(echo "$CONFIG_JSON" | jq -r '.external_id // ""')

          echo "Fetched Release ID: $RELEASE_ID"
          echo "Fetched External ID: $EXTERNAL_ID"

          # Set outputs for next steps
          echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT
          echo "external_id=$EXTERNAL_ID" >> $GITHUB_OUTPUT

          if [ -z "$RELEASE_ID" ] || [ -z "$EXTERNAL_ID" ]; then
            echo "::error::Failed to fetch valid release config from $CONFIG_URL"
            exit 1
          fi

      - name: Check for required secrets
        id: check_secrets
        run: |
          if [ -z "$RELEASENOTES_API_KEY" ]; then
            echo "::error::RELEASENOTES_API_KEY secret is not set"
            exit 1
          fi
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY secret is not set"
            exit 1
          fi
        env:
          RELEASENOTES_API_KEY: ${{ secrets.RELEASENOTES_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RELEASE_ID: ${{ steps.fetch_config.outputs.release_id }}
          EXTERNAL_ID: ${{ steps.fetch_config.outputs.external_id }}
          PROJECT_ID: ${{ vars.PROJECT_ID  }}

      - name: Push to ReleaseNotes.io (via JS)
        if: steps.check_tag.outputs.has_tag == 'true'
        run: |
          # Debug: Print environment variables (without sensitive values)
          echo "Using RELEASE_ID: $RELEASE_ID"
          echo "Using PROJECT_ID: $PROJECT_ID"
          echo "PR Title: $PR_TITLE"
          echo "Commit SHA: $COMMIT_SHA"

          # Run the script
          node .github/scripts/update-draft-release.cjs
        env:
          # Required for ReleaseNotes.io
          RELEASENOTES_API_KEY: ${{ secrets.RELEASENOTES_API_KEY }}
          RELEASE_ID: ${{ steps.fetch_config.outputs.release_id }}
          EXTERNAL_ID: ${{ steps.fetch_config.outputs.external_id }}
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          
          # Required for AI summary generation
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          
          # PR and commit data
          PR_TITLE: ${{ steps.prepare_data.outputs.title }}
          PR_BODY: ${{ steps.prepare_data.outputs.body }}
          PR_NUMBER: ${{ steps.prepare_data.outputs.pr_number }}
          COMMIT_SHA: ${{ steps.prepare_data.outputs.commit_sha }}
