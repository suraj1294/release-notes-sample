      #       && sudo apt-get update \
      #       && sudo apt-get install gh -y
      #     fi

      # - name: Set up GitHub token
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: |
      #     # Configure git
      #     git config --global user.name "GitHub Actions"
      #     git config --global user.email "actions@github.com"
